<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<meta charset="utf-8">

<title>Flight Day</title>

<body>
<div id="stage" class="stage booting">

  <!-- living background: two crossfading layers + adaptive scrim -->
  <div class="bg" id="bg">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
  </div>
  <div class="shade" id="shade"></div>

  <!-- waybar -->
  <header class="bar" id="bar">
    <nav class="ws" id="ws" aria-label="workspaces"></nav>
    <div class="bar-c" id="barCenter"></div>
    <div class="bar-r" id="barRight"></div>
  </header>

  <!-- global LIVE banner (launch / landing / EVA happening now) -->
  <div class="live" id="live" hidden></div>

  <!-- workspaces -->
  <main class="views" id="views">
    <section class="view" id="v-home" data-ws="home"></section>
    <section class="view" id="v-space" data-ws="space"></section>
    <section class="view" id="v-house" data-ws="house"></section>
    <section class="view" id="v-night" data-ws="night"></section>
    <section class="view" id="v-status" data-ws="status"></section>
  </main>

  <!-- mission control feed line: background credit + headline ticker -->
  <footer class="feed" id="feed">
    <div class="feed-l" id="feedCredit"></div>
    <div class="feed-r" id="feedNews"></div>
  </footer>

  <!-- ambient mode (also the TV screensaver) -->
  <section class="ambient" id="ambient" hidden></section>

  <!-- morning launch sequence -->
  <section class="liftoff" id="liftoff" hidden></section>

  <!-- small sheets (arrange Home), power-down sequence, morning alarm bar -->
  <section class="modal sleep" id="sleep" hidden></section>
  <section class="shutdown" id="shutdown" hidden></section>
  <div class="alarm-controls" id="alarmControls" hidden></div>

  <!-- launch watch: the webcast plays here, on this screen -->
  <section class="watch" id="watch" hidden></section>

  <!-- settings -->
  <section class="modal" id="settings" hidden></section>

  <div class="toast" id="toast" hidden></div>
  <div class="popup" id="popup" hidden></div>
  <div class="softoff" id="softoff" hidden></div>
</div>
